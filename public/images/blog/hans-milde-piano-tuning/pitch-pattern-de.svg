<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Gleiche Gesamtlage. Anderes Muster.</title>
<desc id="desc">Alle sechs Töne der durchgezogenen Reihe liegen 31,77 Cent unter der Referenz. In der gestrichelten Reihe liegt E4 weitere 18 Cent tiefer und A4 18 Cent höher. Beide Mediane sind identisch.</desc>
