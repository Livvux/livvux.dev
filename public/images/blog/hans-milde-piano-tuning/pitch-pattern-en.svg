<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Same overall pitch. Different pattern.</title>
<desc id="desc">All six notes in the solid series are 31.77 cents below the reference. In the dashed series, E4 is a further 18 cents lower and A4 is 18 cents higher. Both medians are identical.</desc>
