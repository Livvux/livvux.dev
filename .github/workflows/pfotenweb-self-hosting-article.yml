name: Pfotenweb self-hosting article

on:
  pull_request:
    paths:
      - 'content/pfotenweb-self-hosting/**'
      - 'docs/pfotenweb-self-hosting-article-sources.md'
      - 'tests/pfotenweb-self-hosting-article.test.mjs'
      - '.github/workflows/pfotenweb-self-hosting-article.yml'

permissions:
  contents: read

concurrency:
  group: pfotenweb-article-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Article structure, sources and shell syntax
        run: node --test tests/pfotenweb-self-hosting-article.test.mjs
      - uses: pnpm/action-setup@v4
      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site and compile both MDX articles
        run: pnpm build
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Check real production routes and article metadata
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/pfotenweb-article-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/blog/pfotenweb-self-hosting >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/pfotenweb-article-next.log
            exit 1
          fi
          ARTICLE_BASE_URL=http://localhost:3000 node --test tests/pfotenweb-self-hosting-article.test.mjs
