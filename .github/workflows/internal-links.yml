name: Internal links tool
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/internal-links*'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/internal-links.yml'
permissions:
  contents: read
concurrency:
  group: internal-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests (no API keys or network requests)
        run: node --test tests/internal-links.test.mjs
      - uses: pnpm/action-setup@v4
      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint repository
        run: pnpm lint
      - name: Install browser test runner without changing the project lockfile
        run: |
          npm install --global playwright@1.57.0
          playwright install --with-deps chromium
      - name: Browser smoke test (provider response is a fixture)
        run: |
          pnpm start > /tmp/internal-links-next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/tools/internal-links >/dev/null && break; sleep 1; done
          NODE_PATH="$(npm root -g)" node tests/internal-links.browser.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-links-browser
          path: test-results/internal-links
          if-no-files-found: ignore
          retention-days: 7
