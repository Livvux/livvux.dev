name: Omarchy Linux article

on:
  pull_request:
    paths:
      - 'content/why-linux-omarchy-gaming/**'
      - 'tests/omarchy-article.test.mjs'
      - '.github/workflows/omarchy-article.yml'

permissions:
  contents: read

concurrency:
  group: omarchy-article-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check article structure, source parity and dated survey snapshot
        run: node --test tests/omarchy-article.test.mjs
      - uses: pnpm/action-setup@v4
      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site and compile both MDX articles
        run: pnpm build
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Check article routes, metadata, screenshot and external links
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/omarchy-article-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/blog/why-linux-omarchy-gaming >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/omarchy-article-next.log
            exit 1
          fi
          ARTICLE_BASE_URL=http://localhost:3000 node --test tests/omarchy-article.test.mjs
