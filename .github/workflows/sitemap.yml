name: Sitemap and SEO

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/lib/**'
      - 'src/components/**'
      - 'src/data/resume.tsx'
      - 'content/**'
      - 'content-collections.ts'
      - 'next.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tests/sitemap.*'
      - 'tests/seo.*'
      - 'tests/umami.test.mjs'
      - '.github/workflows/sitemap.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/lib/**'
      - 'src/components/**'
      - 'src/data/resume.tsx'
      - 'content/**'
      - 'content-collections.ts'
      - 'next.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tests/sitemap.*'
      - 'tests/seo.*'
      - 'tests/umami.test.mjs'
      - '.github/workflows/sitemap.yml'

permissions:
  contents: read

concurrency:
  group: sitemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile
      - name: Test sitemap, SEO, and pageview privacy
        run: node --test tests/sitemap.test.mjs tests/seo.test.mjs tests/umami.test.mjs
      - name: Lint SEO and pageview changes
        run: >-
          pnpm exec eslint src/app/sitemap.ts src/app/robots.ts
          src/app/layout.tsx src/app/page.tsx src/app/blog/page.tsx
          'src/app/blog/[...slug]/page.tsx' src/app/tools/page.tsx
          src/app/tools/crawler/page.tsx src/app/tools/internal-links/page.tsx
          src/app/tools/internal-links/layout.tsx src/lib/seo.ts
          src/lib/posts.ts src/lib/blog-pagination.ts
          src/components/breadcrumbs.tsx src/components/structured-data.tsx
          src/components/umami-pageview.tsx src/lib/umami.ts src/app/privacy/page.tsx
          next.config.mjs tests/sitemap.test.mjs tests/seo.test.mjs tests/umami.test.mjs
      - name: Build the complete site
        run: pnpm build
      - name: Check types
        run: pnpm exec tsc --noEmit
      - name: Validate production XML and rendered SEO across the site
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/sitemap-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/sitemap.xml >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/sitemap-next.log
            exit 1
          fi
          SITEMAP_BASE_URL=http://127.0.0.1:3000 python3 tests/sitemap.integration.py
          SEO_BASE_URL=http://127.0.0.1:3000 python3 tests/seo.integration.py
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/sitemap-next.log 2>/dev/null || true
