name: Parasite SEO article

on:
  pull_request:
    paths:
      - 'content/parasite-seo-explained/**'
      - 'public/images/blog/parasite-seo/**'
      - 'docs/parasite-seo-article-sources.md'
      - 'tests/parasite-seo-article.test.mjs'
      - '.github/workflows/parasite-seo-article.yml'

permissions:
  contents: read

concurrency:
  group: parasite-seo-article-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bilingual content, sources and screenshot
        run: node --test tests/parasite-seo-article.test.mjs
      - uses: pnpm/action-setup@v4
      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site and compile both MDX articles
        run: pnpm build
      - name: Check production routes, metadata and screenshot
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/parasite-seo-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/blog/parasite-seo-explained >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/parasite-seo-next.log
            exit 1
          fi
          ARTICLE_BASE_URL=http://localhost:3000 node --test tests/parasite-seo-article.test.mjs
